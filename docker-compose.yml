name: novo
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: novo
      POSTGRES_PASSWORD: novo_dev_password
      POSTGRES_DB: novo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novo -d novo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - novo-postgres:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: novo-minio
      MINIO_ROOT_PASSWORD: novo-minio-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - novo-minio:/data
volumes:
  novo-postgres:
  novo-minio:
