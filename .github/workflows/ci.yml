name: CI
on:
  push:
  pull_request:
jobs:
  api-and-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novo
          POSTGRES_PASSWORD: novo_ci_password
          POSTGRES_DB: novo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novo -d novo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://novo:novo_ci_password@localhost:5432/novo_ci?schema=public
      WEB_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /tmp/novo-api-test-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify legacy Store SKU migration safety
        run: pnpm --filter @novo/api test:legacy-sku-migration
      - run: pnpm --filter @novo/api exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; assert torch.version.cuda is None, torch.version.cuda; print('torch=' + torch.__version__ + ' cuda=' + str(torch.version.cuda))"
      - name: Install ML dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Verify RAG dependencies
        run: python -c "import chromadb, sentence_transformers; print('chroma-and-sentence-transformers-imported')"
      - name: Test ML training and lightweight RAG path
        run: python -m pytest -q
