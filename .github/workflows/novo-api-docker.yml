name: NOVO API Docker smoke

on:
  push:
    branches:
      - codex/sprint-04-store-pos-inventory
    paths:
      - '.github/workflows/novo-api-docker.yml'
      - '.dockerignore'
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --tag novo-api:ci \
            .

      - name: Validate compiled maintenance command
        run: |
          docker run --rm \
            --entrypoint node \
            novo-api:ci \
            --check apps/api/dist/maintenance/purge-expired-import-previews.js

      - name: Verify Prisma CLI in runtime image
        run: |
          docker run --rm --entrypoint sh novo-api:ci -ec \
            'test -f apps/api/prisma/schema.prisma &&
             test -d apps/api/prisma/migrations &&
             test -x apps/api/node_modules/.bin/prisma &&
             apps/api/node_modules/.bin/prisma --version'

      - name: Verify missing DATABASE_URL is rejected
        shell: bash
        run: |
          set +e
          output=$(docker run --rm \
            --env DATABASE_URL='' \
            novo-api:ci \
            node apps/api/dist/maintenance/purge-expired-import-previews.js \
            2>&1)
          exit_code=$?
          set -e

          if [ "$exit_code" -ne 1 ]; then
            echo "Expected exit code 1."
            exit 1
          fi

          if ! grep -q 'Import preview retention purge failed.' <<< "$output"; then
            echo "Expected fail-closed error message."
            exit 1
          fi

          echo "Fail-closed maintenance smoke PASS."

      - name: Verify API health endpoint
        shell: bash
        run: |
          set -euo pipefail

          container_id=$(docker run --detach \
            --publish 127.0.0.1:18080:4000 \
            --env NODE_ENV=production \
            --env PORT=4000 \
            --env DATABASE_URL='postgresql://synthetic:synthetic@127.0.0.1:15432/synthetic?schema=public' \
            novo-api:ci)

          trap 'docker logs "$container_id" || true; docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:18080/healthz \
              | grep -q '"status":"ok"'; then
              echo "API health smoke PASS."
              exit 0
            fi

            sleep 2
          done

          echo "API health smoke FAILED."
          exit 1
